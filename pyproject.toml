[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-email-gw"
version = "0.3.0"
description = "Simple email gateway with IMAP/SMTP clients, connection pooling, and MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Christophe VG", email = "contact@christophe.vg"}]
keywords = ["email", "imap", "smtp", "mcp", "model-context-protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

dependencies = [
  "fastmcp>=3.0.0",
  "aioimaplib>=1.0.0",
  "aiosmtplib>=3.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "rich>=13.0.0",
  "prompt_toolkit>=3.0.0",
  "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
docs = [
  "sphinx>=7.0.0",
  "sphinx-rtd-theme>=2.0.0",
  "myst-parser>=2.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.13.0",
  "ruff>=0.8.0",
  "tox>=4.0.0",
  "tox-uv>=1.0.0",
  "build>=1.0.0",
  "twine>=6.0.0",
  "coveralls>=3.3.0",
]

[project.scripts]
email-gw-mcp-server = "simple_email_gw.mcp:run"
email-gw-cli = "simple_email_gw.cli.app:main"

[project.urls]
Homepage = "https://github.com/christophevg/simple-email-gw"
Documentation = "https://github.com/christophevg/simple-email-gw#readme"
Repository = "https://github.com/christophevg/simple-email-gw"
Issues = "https://github.com/christophevg/simple-email-gw/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_email_gw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=simple_email_gw --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "aioimaplib.*"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "simple_email_gw.imap.client"
disable_error_code = ["no-any-return", "assignment", "arg-type", "union-attr", "dict-item"]

[[tool.mypy.overrides]]
module = "simple_email_gw.smtp.client"
disable_error_code = ["assignment", "arg-type"]

[tool.ruff]
line-length = 100
target-version = "py310"
indent-width = 2

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["simple_email_gw"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.tox]
env_list = ["py310", "py311", "py312"]

[tool.tox.env_run_base]
description = "run tests with pytest"
skip_install = false
commands_pre = [
  ["uv", "pip", "install", "-e", "."],
  ["uv", "pip", "install", "pytest", "pytest-cov", "pytest-asyncio"],
]
commands = [["pytest", "tests", "-v", "--cov=simple_email_gw", "--cov-report=term-missing"]]